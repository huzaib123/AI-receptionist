version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: receptionist_db
    restart: always
    environment:
      POSTGRES_USER: receptionist
      POSTGRES_PASSWORD: secretpassword_987
      POSTGRES_DB: receptionist_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: receptionist_app
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://receptionist:secretpassword_987@db:5432/receptionist_prod
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-gpt-4o-mini}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.3}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-dev_secret_key_123}
      - CHAT_RATE_LIMIT_PER_MINUTE=${CHAT_RATE_LIMIT_PER_MINUTE:-60}
      - GOOGLE_SERVICE_ACCOUNT_FILE=${GOOGLE_SERVICE_ACCOUNT_FILE}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID:-primary}
      - BUSINESS_TIMEZONE=${BUSINESS_TIMEZONE:-Asia/Karachi}
      - BUSINESS_HOURS_START=${BUSINESS_HOURS_START:-9}
      - BUSINESS_HOURS_END=${BUSINESS_HOURS_END:-19}

volumes:
  postgres_data:
